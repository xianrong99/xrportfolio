    <!-- Dynamic Component Loader -->
    <script>

      
      /**
       * Dynamically include an HTML file into a given element by ID.
       * Shows a loading message and handles errors gracefully.
       */
      function includeHTML(id, file, callback) {
        const element = document.getElementById(id);
        if (!element) return;

        // Show loading placeholder
        element.innerHTML = `<div class="text-center py-3 text-muted small">Loading ${id}...</div>`;

        // Fetch the component
        fetch(file)
          .then(response => {
            if (!response.ok) throw new Error(`Failed to load ${file}: ${response.status}`);
            return response.text();
          })
          .then(data => {
            element.innerHTML = data;
            if (callback) callback();
          })
          .catch(error => {
            console.error(error);
            element.innerHTML = `<div class="alert alert-danger m-3" role="alert">
              Error loading ${file}. Please try again later.
            </div>`;
          });
      }

      // Include all modular components
      document.addEventListener("DOMContentLoaded", () => {
        includeHTML("navbar", "components/navbar.html");
        includeHTML("sidebar", "components/sidebar.html");
                includeHTML("contentview", "components/contentview.html", () => {
          // Reinitialize slideshow after content loads
          slideIndex = 1;
          showDivs(slideIndex);
        });
        includeHTML("footer", "components/footer.html");
      });
    </script>
    <script>
var slideIndex = 1;
showDivs(slideIndex);

function plusDivs(n) {
  showDivs(slideIndex += n);
}

function currentDiv(n) {
  showDivs(slideIndex = n);
}

function showDivs(n) {
  var i;
  var x = document.getElementsByClassName("mySlides");
  var dots = document.getElementsByClassName("demo");
  if (n > x.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = x.length}
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";  
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].classList.remove("active");
  }
  x[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].classList.add("active");
}
</script>
